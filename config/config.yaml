camera:
  backend: opencv          # PC에서는 opencv, RPi에서는 picamera2
  device_index: 0
  width: 640
  height: 480

recognition:
  embedding_dim: 512
  distance_threshold: 0.9

gpio:
  enabled: false           # PC에서는 false, RPi에서는 true
  green_led_pin: 17
  red_led_pin: 27
  buzzer_pin: 22

logging:
  access_log_path: "logs/access_log.csv"
  debug_log_path: "logs/debug.log"

detection:
  conf_threshold: 0.4

models:
  detection:
    onnx_path: "models/yolov8_face.onnx"
  embedding:
    onnx_path: "models/facenet.onnx"
  recognition:
    embedding_dim: 512
    threshold: 0.9

runtime:
  backend: "cpu"
